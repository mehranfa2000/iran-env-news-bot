<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد اخبار محیط زیست ایران</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f4f7f6; font-family: Tahoma, sans-serif; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .sidebar { background: #1a5e20; color: white; min-height: 100vh; padding: 20px; }
        .stat-card { transition: transform 0.3s; }
        .stat-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar d-none d-md-block">
                <h4 class="text-center mb-4">مدیریت بات</h4>
                <hr>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link text-white" href="#">🏠 داشبورد</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#">📊 آمار کل</a></li>
                </ul>
            </div>
            <!-- Main Content -->
            <div class="col-md-10 p-4">
                <h2 class="mb-4">📊 وضعیت پایش محیط زیست</h2>
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card p-3 stat-card text-center bg-white">
                            <h6>کل اخبار پردازش شده</h6>
                            <h2 id="totalNews">...</h2>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-7">
                        <div class="card p-4">
                            <h5>آخرین اخبار ارسالی</h5>
                            <div id="newsList" class="list-group list-group-flush">
                                <!-- اخبار اینجا نمایش داده می‌شوند -->
                                بارگذاری...
                            </div>
                        </div>
                    </div>
                    <div class="col-md-5">
                        <div class="card p-4 text-center">
                            <h5>توزیع موضوعی اخبار</h5>
                            <canvas id="categoryChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // در مرحله بعد کدهای اتصال به دیتابیس را اینجا می‌نویسیم
    </script>
</body>
</html>
