name: 🌿 پایش هوشمند محیط‌زیست

on:
  schedule:
    - cron: '0 * * * *'    # هر ساعت یک‌بار
  workflow_dispatch:         # اجرای دستی

permissions:
  contents: write

concurrency:
  group: env-news-bot
  cancel-in-progress: false  # هیچ ران جاری لغو نمی‌شود

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ── ۱. Checkout ──────────────────────────────────────────────────────
      - name: ⬇️ Checkout مخزن
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── ۲. Python ────────────────────────────────────────────────────────
      - name: 🐍 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ── ۳. وابستگی‌ها ────────────────────────────────────────────────────
      - name: 📦 نصب وابستگی‌ها
        run: |
          pip install --upgrade pip
          pip install \
            feedparser==6.0.11       \
            requests==2.32.3         \
            beautifulsoup4==4.12.3   \
            lxml==5.3.0              \
            jdatetime==4.1.1         \
            google-generativeai==0.8.3 \
            urllib3==2.2.1

      # ── ۴. اجرای سامانه ──────────────────────────────────────────────────
      - name: 🤖 اجرای سامانه پایش
        env:
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BALE_BOT_TOKEN:      ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID:     ${{ secrets.BALE_CHANNEL_ID }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH:          ${{ github.workspace }}
        run: python main.py

      # ── ۵. ذخیره داده‌ها (همیشه اجرا می‌شود) ────────────────────────────
      - name: 💾 ذخیره و push داده‌ها
        if: always()
        run: |
          # ─── کپی فایل‌های جدید به tmp ───────────────────────────────────
          cp data/news.json        /tmp/news_new.json        2>/dev/null || true
          cp data/run_stats.json   /tmp/run_stats_new.json   2>/dev/null || true
          cp data/agent.log        /tmp/agent_log_new.log    2>/dev/null || true

          # ─── تنظیم git ──────────────────────────────────────────────────
          git config user.name  "EnvBot[bot]"
          git config user.email "envbot@noreply.github.com"

          # ─── استراتژی ضدتعارض ──────────────────────────────────────────
          git fetch origin main
          git reset --soft origin/main

          # ─── بازگرداندن فایل‌های جدید ──────────────────────────────────
          mkdir -p data
          cp /tmp/news_new.json      data/news.json      2>/dev/null || true
          cp /tmp/run_stats_new.json data/run_stats.json 2>/dev/null || true

          # ─── ✅ هر دو فایل داده را add کن ───────────────────────────────
          git add data/news.json data/run_stats.json || true

          # ─── اگر تغییری نیست، skip ─────────────────────────────────────
          if git diff --staged --quiet; then
            echo "⏭  تغییری برای commit نیست"
            exit 0
          fi

          git commit -m "🤖 auto: news update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main

      # ── ۶. لاگ در صورت خطا ───────────────────────────────────────────────
      - name: 📋 لاگ خطا
        if: failure()
        run: |
          echo "════════════════════════════════"
          echo "آخرین ۸۰ خط لاگ:"
          echo "════════════════════════════════"
          tail -80 data/agent.log 2>/dev/null || echo "فایل لاگ وجود ندارد"
