name: 🌿 Iran Env News Bot

on:
  schedule:
    - cron: "0 * * * *"   # هر ساعت
  workflow_dispatch:        # اجرای دستی

concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            feedparser==6.0.11 \
            requests==2.32.3 \
            beautifulsoup4==4.12.3 \
            lxml==5.3.0 \
            jdatetime==4.1.1 \
            google-generativeai==0.8.3

      - name: 🌿 Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BALE_BOT_TOKEN:      ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID:     ${{ secrets.BALE_CHANNEL_ID }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          PYTHONWARNINGS: ignore
        run: python main.py

      - name: 📤 Commit & Push (conflict-safe)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # کپی فایل‌های جدید به /tmp
          cp data/news.json      /tmp/news_new.json      2>/dev/null || true
          cp data/run_stats.json /tmp/run_stats_new.json 2>/dev/null || true

          # بروزرسانی از ریموت
          git fetch origin main
          git reset --soft origin/main

          # بازگرداندن فایل‌های جدید
          cp /tmp/news_new.json      data/news.json      2>/dev/null || true
          cp /tmp/run_stats_new.json data/run_stats.json 2>/dev/null || true

          git add data/news.json data/run_stats.json || true

          # اگر تغییری نباشد exit
          git diff --staged --quiet && echo "⏭ تغییری نیست" && exit 0

          git commit -m "🤖 auto: news update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main
