# run.yml — v4.0
# ایجنت هوشمند محیط‌زیست — اجرای هر ۱ ساعت

name: 🌿 Iran Env News Agent v4.0

on:
  schedule:
    - cron: "0 * * * *"   # هر ساعت دقیق
  workflow_dispatch:        # اجرای دستی

concurrency:
  group: iran-env-news-bot
  cancel-in-progress: false  # هیچ اجرایی لغو نمی‌شود

permissions:
  contents: write           # برای commit و push

jobs:
  run-agent:
    name: Run News Agent
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── ۱) دریافت کد ────────────────────────────────────────
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # تاریخچه کامل برای rebase
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── ۲) Python ───────────────────────────────────────────
      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"          # کش pip برای سرعت بیشتر

      # ── ۳) نصب وابستگی‌ها ───────────────────────────────────
      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            feedparser==6.0.11 \
            requests==2.32.3 \
            beautifulsoup4==4.12.3 \
            lxml==5.3.0 \
            jdatetime==4.1.1 \
            google-generativeai==0.8.3

      # ── ۴) ایجاد پوشه data ──────────────────────────────────
      - name: 📁 Ensure data directory
        run: mkdir -p data

      # ── ۵) اجرای ایجنت ──────────────────────────────────────
      - name: 🚀 Run agent
        env:
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BALE_BOT_TOKEN:      ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID:     ${{ secrets.BALE_CHANNEL_ID }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      # ── ۶) commit و push ────────────────────────────────────
      - name: 💾 Commit and push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/run_stats.json || true
          git diff --staged --quiet && echo "⏭ تغییری نیست" && exit 0
          git commit -m "🤖 auto: news update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin main
