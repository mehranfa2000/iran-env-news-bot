name: 📡 جمع‌آوری، تحلیل و ارسال

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: iran-env-news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: ⬇️ دریافت کدها
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 نصب Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 نصب کتابخانه‌ها
        run: pip install -r requirements.txt

      - name: 🤖 اجرای سیستم
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: 💾 ذخیره تغییرات
        run: |
          git config --global user.name "Iran Env Bot"
          git config --global user.email "bot@iran-env.ir"
          git add data/news.json
          git diff --staged --quiet || git commit -m "🌿 بروزرسانی اخبار - $(date +'%Y-%m-%d %H:%M')"
          git push
