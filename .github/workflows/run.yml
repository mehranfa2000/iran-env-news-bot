name: 🌿 پایش اخبار محیط زیست

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    name: 📡 جمع‌آوری و ارسال
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 دریافت مخزن
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 نصب کتابخانه‌ها
        run: pip install -r requirements.txt

      - name: 🌿 اجرای ربات
        env:
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BALE_BOT_TOKEN:      ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID:     ${{ secrets.BALE_CHANNEL_ID }}
        run: python main.py

      - name: 💾 ذخیره news.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "✅ تغییری نیست"
          else
            git commit -m "📰 بروزرسانی — $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
            echo "✅ push شد"
          fi
